name: Veri güncelle

# data/raw/ klasörüne bir dosya yüklendiğinde (evds, sofr, estr, sonia, tona)
# kendiliğinden çalışır ve dataset dosyalarını yeniden üretir.
# Actions sekmesinden "Run workflow" ile elle de başlatılabilir.
#
# Sonsuz döngü olmaz: bu iş kendi commit'ini GITHUB_TOKEN ile attığı için
# GitHub o commit'te yeni bir çalıştırma başlatmaz.
on:
  push:
    paths:
      - "data/raw/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veri-guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install --quiet pandas openpyxl

      - name: dataset dosyalarını üret
        run: python scripts/update_data.py

      - name: Değişiklikleri commit'le
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dataset.json data/dataset.csv
          if git diff --staged --quiet; then
            echo "Veride değişiklik yok, commit yapılmadı."
          else
            git commit -m "Veri güncellendi ($(date -u +%d.%m.%Y))"
            git push
            echo "Veri güncellendi ve yayınlandı."
          fi
